# 107-Agent Docker Compose 配置
version: '3.8'

services:
  # ── 应用服务 ──
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: 107-agent-app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-false}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-7b}
      - SSH_HOST=${SSH_HOST}
      - SSH_PORT=${SSH_PORT:-22}
      - SSH_USER=${SSH_USER}
      - SSH_KEY_PATH=/app/keys/id_rsa
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:////app/data/app.db
    volumes:
      - app-data:/app/data
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/app/keys/id_rsa:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-network

  # ── Redis 缓存 ──
  redis:
    image: redis:7-alpine
    container_name: 107-agent-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agent-network

  # ── Nginx 反向代理（可选） ──
  nginx:
    image: nginx:alpine
    container_name: 107-agent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - production
    networks:
      - agent-network

volumes:
  app-data:
    driver: local
  redis-data:
    driver: local

networks:
  agent-network:
    driver: bridge
